; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nyanbox-main]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -Wl,-z,muldefs
lib_deps =
	nrf24/RF24@^1.4.10
	olikraus/U8g2@^2.36.2
	adafruit/Adafruit NeoPixel@^1.12.3
	bblanchon/ArduinoJson@^7.4.2
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:nyanbox-cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    nrf24/RF24@^1.4.10
    olikraus/U8g2@^2.36.2
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.4.2
    bodmer/TFT_eSPI@^2.5.43
; Touch (XPT2046) is bit-banged in src/touch_input.cpp (risk E1) — no library needed.

; Force-include the U8g2->TFT bridge into PROJECT SOURCES ONLY.
; MUST be build_src_flags, not build_flags, or the C++ header breaks U8g2's C core files.
build_src_flags =
    -include include/cyd_u8g2_bridge.h

build_flags =
    -Wl,-z,muldefs
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D USE_HSPI_PORT
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

[env:hardware-test]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	nrf24/RF24@^1.4.10
	olikraus/U8g2@^2.36.2
	adafruit/Adafruit NeoPixel@^1.12.3
monitor_speed = 115200
build_src_filter =
	+<../hardware-test/nyanbox_hardware_test.cpp>
	-<*>
